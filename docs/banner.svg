<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0B24"/>
      <stop offset="1" stop-color="#0B1B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"><animate attributeName="stop-color" values="#7C5CFF;#22D3EE;#7C5CFF" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#7C5CFF;#22D3EE" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22B5EE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="28"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 58px; font-weight: 700; fill: #FFFFFF; letter-spacing: -1px; }
      .sub { font-size: 22px; fill: #B9B4E6; }
      .by { font-size: 18px; fill: #8E89C4; }
      .chip { font-size: 15px; fill: #E9E6FF; font-weight: 600; }
      .fade1 { opacity: 0; animation: in 0.9s 0.1s ease-out forwards; }
      .fade2 { opacity: 0; animation: in 0.9s 0.45s ease-out forwards; }
      .fade3 { opacity: 0; animation: in 0.9s 0.8s ease-out forwards; }
      .fade4 { opacity: 0; animation: in 0.9s 1.15s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .arrow { animation: bob 1.8s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(8px); } }
      .bar { animation: fill 3.2s ease-in-out infinite; }
      @keyframes fill { 0% { width: 0; } 70% { width: 420px; } 100% { width: 420px; } }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,30px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-20px); } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle class="float1" cx="230" cy="80" r="260" fill="url(#glow1)"/>
    <circle class="float2" cx="1050" cy="300" r="280" fill="url(#glow2)"/>
    <g opacity="0.08" stroke="#FFFFFF">
      <path d="M0 85 H1200 M0 170 H1200 M0 255 H1200 M150 0 V340 M300 0 V340 M450 0 V340 M600 0 V340 M750 0 V340 M900 0 V340 M1050 0 V340"/>
    </g>

    <!-- logo tile -->
    <g transform="translate(88 92)"><g class="fade1">
      <rect width="156" height="156" rx="38" fill="url(#tile)"/>
      <rect width="156" height="156" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <g class="arrow">
        <path d="M78 36 V96 M50 70 L78 98 L106 70" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <rect x="40" y="114" width="76" height="12" rx="6" fill="#FFFFFF"/>
    </g></g>

    <g class="t">
      <text class="title fade2" x="290" y="150">AEF Download Manager</text>
      <text class="sub fade3" x="292" y="192">Accelerated downloads · Video from any site · Built-in VPN · Torrents · Mobile</text>
      <text class="by fade3" x="292" y="226">by <tspan fill="#FFFFFF" font-weight="600">Amr Farahat</tspan>  ·  Windows 10 / 11</text>
    </g>

    <!-- animated progress -->
    <g transform="translate(292 252)"><g class="fade4">
      <rect width="420" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect class="bar" width="0" height="10" rx="5" fill="url(#accent)"/>
      <text class="t chip" x="440" y="10">32 connections · resume · auto-update</text>
    </g></g>
  </g>
</svg>
